<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suvai Engine Companion</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #1e293b;
            --primary-color: #b45309;
            --primary-light: #fef3c7;
            --border-color: #cbd5e1;
            --card-bg: #ffffff;
            --danger-color: #ef4444;
            --timer-bg: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.5; padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 60px; }
        
        header { text-align: center; padding: 20px 0; border-bottom: 2px dashed var(--primary-color); margin-bottom: 16px; }
        h1 { font-size: 20px; color: var(--primary-color); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        
        .scale-container { display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--primary-light); padding: 8px 16px; border-radius: 20px; margin-top: 10px; font-weight: bold; display: inline-flex; }
        .scale-btn { background: var(--primary-color); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        .sticky-nav { position: sticky; top: 0; background: rgba(253, 251, 247, 0.96); padding: 8px 0; z-index: 100; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-around; backdrop-filter: blur(4px); margin-bottom: 16px; }
        .sticky-nav a { color: var(--text-color); text-decoration: none; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 16px; background: #e2e8f0; }

        h2 { font-size: 16px; color: var(--primary-color); margin: 20px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid var(--border-color); text-transform: uppercase; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        .alert-box { background-color: #fffbec; border: 1px solid #ffe49e; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; gap: 10px; font-size: 13px; }
        .interactive-item { display: flex; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .interactive-item:last-child { border-bottom: none; }
        
        input[type="checkbox"] { min-width: 22px; min-height: 22px; width: 22px; height: 22px; margin-right: 10px; cursor: pointer; accent-color: var(--primary-color); margin-top: 1px; }
        input[type="checkbox"]:checked + span { text-decoration: line-through; color: #94a3b8; }
        .item-text { font-size: 14px; flex-grow: 1; }
        .qty-num { font-weight: 700; color: var(--primary-color); }
        
        .step-block { border-left: 3px solid var(--primary-color); padding-left: 8px; margin-top: 6px; }
        .step-header { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 14px; margin-top: 12px; }
        .time-badge { background-color: var(--primary-light); color: var(--primary-color); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        
        .timer-module { display: inline-flex; align-items: center; gap: 8px; background: var(--timer-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; font-size: 13px; margin: 6px 0; }
        .timer-btn { background: var(--primary-color); color: white; border: none; padding: 2px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .timer-btn.active { background: var(--danger-color); }
        .timer-display { font-family: monospace; font-weight: bold; }
        
        .layer-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
        .layer-table td { padding: 6px; border: 1px solid var(--border-color); text-align: center; }
        .l-top { background-color: #ffedd5; font-weight: bold; }
        .l-rice { background-color: #f8fafc; }
        .l-gravy { background-color: #fff7ed; font-weight: bold; }
        .err-msg { text-align: center; color: var(--danger-color); padding: 40px 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="engine-mount"></div>

    <script>
        document.write('<script src="recipes.js?v=' + Math.random() + '"><\/script>');
    </script>
    <script>
        let currentScale = 1.0;
        let activeIntervals = new Map();
        let currentRecipe = null;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const recipeId = urlParams.get('id');
            
            if (!recipeId || !recipeDatabase[recipeId]) {
                document.getElementById('engine-mount').innerHTML = `<div class="err-msg">RECIPE CONFIGURATION ERROR: Invalid or missing recipe reference ID parameter.</div>`;
                return;
            }
            
            currentRecipe = recipeDatabase[recipeId];
            renderRecipeEngine(currentRecipe);
        });

        function renderRecipeEngine(data) {
            let sectionsHTML = '';
            data.sections.forEach(sec => {
                let itemsHTML = '';
                sec.items.forEach(item => {
                    itemsHTML += `
                        <label class="interactive-item">
                            <input type="checkbox">
                            <span class="item-text">${item.text}: <span class="qty-num" data-base="${item.base}">${item.base}</span> ${item.unit}.</span>
                        </label>
                    `;
                });
                sectionsHTML += `
                    <div class="card">
                        <div style="font-weight:700; margin-bottom:6px; font-size:13px; color:var(--primary-color);">${sec.name}</div>
                        ${itemsHTML}
                    </div>
                `;
            });

            let stepsHTML = '';
            data.steps.forEach(st => {
                let timersHTML = '';
                if (st.timer) {
                    timersHTML = `
                        <div class="timer-module" data-time="${st.timer}">
                            <button class="timer-btn" onclick="triggerClock(this)">Start ${(st.timer/60)}m</button>
                            <span class="timer-display">${formatSecondsToClock(st.timer)}</span>
                        </div>
                    `;
                } else if (st.timers) {
                    st.timers.forEach(t => {
                        timersHTML += `
                            <div class="timer-module" data-time="${t.secs}">
                                <button class="timer-btn" onclick="triggerClock(this)">${t.name} (${t.secs >= 60 ? (t.secs/60)+'m' : t.secs+'s'})</button>
                                <span class="timer-display">${formatSecondsToClock(t.secs)}</span>
                            </div>
                        `;
                    });
                }

                let stepLines = '';
                st.instructions.forEach(ins => {
                    stepLines += `
                        <label class="interactive-item">
                            <input type="checkbox">
                            <span class="item-text">${ins}</span>
                        </label>
                    `;
                });

                stepsHTML += `
                    <div class="card">
                        <div class="step-header">
                            <span>${st.title}</span>
                            <span class="time-badge">${st.badge}</span>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">${timersHTML}</div>
                        <div class="step-block">${stepLines}</div>
                    </div>
                `;
            });

            let blueprintHTML = '';
            if (data.showLayeringTable) {
                blueprintHTML = `
                    <div style="font-weight:700; margin-bottom:6px; font-size:13px; color:var(--primary-color);">Structural Layer Blueprint</div>
                    <table class="layer-table">
                        <tr class="l-top"><td>TOP LAYER: Foil Airtight Seal + Lid + Solid Deck Weight</td></tr>
                        <tr class="l-rice"><td>Pour Saffron Water + <span class="qty-num" data-base="1">1</span> tbsp Ghee + <span class="qty-num" data-base="1">1</span> tbsp Fresh Cream</td></tr>
                        <tr class="l-rice"><td>Remaining 90% Cooked Basmati Rice Layer</td></tr>
                        <tr class="l-gravy"><td>Drizzle the 1 Reserved Spoonful of Hundi Gravy Base</td></tr>
                        <tr class="l-rice"><td>First 50% Slab of par-cooked Basmati Rice (Smooth and flat)</td></tr>
                        <tr class="l-gravy"><td>BASE LAYER: Core Hundi Rice Gravy Mixture</td></tr>
                    </table>
                `;
            }

            const frame = `
                <header>
                    <h1>${data.title}</h1>
                    <div class="scale-container">
                        <span>Batch Scale:</span>
                        <button class="scale-btn" onclick="alterScale(-0.5)">-</button>
                        <span id="scale-factor">1.0x</span>
                        <button class="scale-btn" onclick="alterScale(0.5)">+</button>
                    </div>
                </header>

                <div class="sticky-nav">
                    <a href="#misen">1. Prep Checklist</a>
                    <a href="#thermal">2. Thermal Steps</a>
                    <a href="#layering">3. Assembly</a>
                </div>

                <div class="alert-box">
                    <span>⚠️</span>
                    <div>${data.note}</div>
                </div>

                <h2 id="misen">1. Prep & Mise En Place</h2>
                ${sectionsHTML}

                <h2 id="thermal">2. Thermal Processing Steps</h2>
                ${stepsHTML}

                <h2 id="layering">3. Final Assembly & Dum</h2>
                <div class="card">
                    ${blueprintHTML}
                    <div style="margin-top:14px;">
                        <div class="step-header">
                            <span>${data.dumTitle}</span>
                            <span class="time-badge">${data.dumBadge}</span>
                        </div>
                        <div class="timer-module" data-time="${data.dumTimer}">
                            <button class="timer-btn" onclick="triggerClock(this)">Start Dum</button>
                            <span class="timer-display">${formatSecondsToClock(data.dumTimer)}</span>
                        </div>
                        <label class="interactive-item" style="margin-top:6px;">
                            <input type="checkbox">
                            <span class="item-text">${data.dumInstruction}</span>
                        </label>
                    </div>
                </div>

                <footer style="text-align:center; padding:12px 0; color:#64748b; font-size:11px;">Suvai Stack Engine Shell</footer>
            `;

            document.getElementById('engine-mount').innerHTML = frame;
        }

        function alterScale(delta) {
            let target = currentScale + delta;
            if (target < 0.5 || target > 4.0) return;
            currentScale = target;
            document.getElementById('scale-factor').textContent = currentScale.toFixed(1) + 'x';
            
            document.querySelectorAll('.qty-num').forEach(node => {
                let baseVal = parseFloat(node.getAttribute('data-base'));
                let rawScaled = baseVal * currentScale;
                let cleanVal = (rawScaled % 1 === 0) ? rawScaled : rawScaled.toFixed(2).replace(/\.?0+$/, "");
                node.textContent = cleanVal;
            });
        }

        function triggerClock(btn) {
            const wrap = btn.closest('.timer-module');
            const output = wrap.querySelector('.timer-display');
            const totalSecs = parseInt(wrap.getAttribute('data-time'), 10);
            
            if (activeIntervals.has(wrap)) {
                clearInterval(activeIntervals.get(wrap));
                activeIntervals.delete(wrap);
                btn.textContent = "Start " + (totalSecs >= 60 ? (totalSecs / 60) + "m" : totalSecs + "s");
                btn.classList.remove('active');
                output.textContent = formatSecondsToClock(totalSecs);
            } else {
                let secondsLeft = totalSecs;
                btn.textContent = "Reset";
                btn.classList.add('active');
                
                const id = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft <= 0) {
                        clearInterval(id);
                        activeIntervals.delete(wrap);
                        output.textContent = "00:00";
                        btn.textContent = "Start " + (totalSecs >= 60 ? (totalSecs / 60) + "m" : totalSecs + "s");
                        btn.classList.remove('active');
                        fireAcousticNote();
                    } else {
                        output.textContent = formatSecondsToClock(secondsLeft);
                    }
                }, 1000);
                activeIntervals.set(wrap, id);
            }
        }

        function formatSecondsToClock(totalSecs) {
            const m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            const s = (totalSecs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function fireAcousticNote() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const nodeGain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                nodeGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                osc.connect(nodeGain);
                nodeGain.connect(audioCtx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 350);
            } catch (err) {
                console.log("Audio node bypass:", err);
            }
        }
    </script>
</body>
</html>
